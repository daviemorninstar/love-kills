<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>A Little Night Between Two Stars</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="intro" class="scene">
  <div class="stars"></div>
  <div class="meteor"></div>
  <div class="intro-copy">
    <div class="tiny">SOMEWHERE BEYOND MIDNIGHT</div>
    <h1>A LITTLE NIGHT<br>BETWEEN TWO STARS</h1>
    <p>Something has arrived.</p>
    <button id="start">ENTER THE NIGHT</button>
  </div>
</div>

<div id="game" class="scene hidden">
  <div class="hud">
    <span id="chapter">NIGHT I</span>
    <span id="hint">TAP THE NIGHT</span>
  </div>
  <div id="sky"></div>
  <div id="moon"></div>
  <div id="lucifer" class="sprite"><img src="lucifer.png" alt="Pixel Lucifer"></div>
  <div id="michael" class="sprite"><img src="michael.png" alt="Pixel Michael"></div>
  <div id="dialogue" class="dialogue hidden">
    <div id="speaker"></div>
    <div id="line"></div>
    <button id="next">CONTINUE</button>
  </div>
  <div id="ending" class="ending hidden">
    <div class="tiny">THE NIGHT IS QUIET AGAIN</div>
    <h2>Some stars are<br>worth chasing.</h2>
    <p>And some are worth finding.</p>
    <button id="again">PLAY AGAIN</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
